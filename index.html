<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171c" media="(prefers-color-scheme: dark)">
<title>Mapa VŠCHT – budovy A a B</title>
<meta name="description" content="Neoficiální mapa a navigace po budovách A a B VŠCHT Praha.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233b5bdb'/%3E%3Cpath d='M32 12c-9 0-16 7-16 15.500c0 11 16 24.500 16 24.500s16-13.500 16-24.500C48 19 41 12 32 12z' fill='%23fff'/%3E%3Ccircle cx='32' cy='27' r='6' fill='%233b5bdb'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="sky"></div>
<div id="stage"><canvas id="map" aria-label="Mapa budov A a B"></canvas></div>

<!-- horní lišta: hledání -->
<div id="top">
  <div id="searchbox">
    <button id="back" class="ib" aria-label="Zpět" hidden>
      <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg>
    </button>
    <svg id="lupa" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.500"/><path d="M16 16l5 5"/></svg>
    <input id="q" type="search" inputmode="search" enterkeyhint="search" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="Hledat místnost – A136, BI, AS12…">
    <button id="clear" class="ib" aria-label="Smazat" hidden><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <button id="info" class="ib" aria-label="O mapě"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.500v.01"/></svg></button>
  </div>
  <div id="chips">
    <button data-chip="lecture">🎓 Posluchárny</button>
    <button data-chip="wc">🚻 WC</button>
    <button data-chip="lift">🛗 Výtahy</button>
    <button data-chip="ent">🚪 Vchody</button>
    <button data-chip="drive" class="accent">🚗 Driver mode</button>
  </div>
  <div id="results" hidden></div>
</div>

<!-- pravý sloupec: patra + kompas -->
<div id="side">
  <button id="compass" class="fab" aria-label="Natočit na sever"><svg viewBox="0 0 24 24"><path d="M12 3l4 9h-8z" fill="#e03131" stroke="none"/><path d="M12 21l-4-9h8z" fill="currentColor" stroke="none" opacity=".35"/></svg></button>
  <button id="locate" class="fab" aria-label="Moje poloha"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.5" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="7.5"/><path d="M12 1.5v4M12 18.5v4M1.5 12h4M18.5 12h4"/></svg></button>
  <div id="floors" role="radiogroup" aria-label="Patro"></div>
  <div id="zoom">
    <button id="zin" aria-label="Přiblížit">+</button>
    <button id="zout" aria-label="Oddálit">−</button>
  </div>
</div>

<div id="sheet" hidden></div>
<div id="toast" hidden></div>
<div id="fx"></div>

<!-- Driver mode HUD -->
<div id="drv" hidden>
  <div id="drv-top">
    <div id="drv-arrow">↑</div>
    <div id="drv-txt"><b id="drv-dist">–</b><span id="drv-instr">Držte plyn a jeďte</span></div>
    <button id="drv-mute" aria-label="Zvuk">🔊</button>
  </div>
  <div id="drv-alert" hidden></div>
  <div id="drv-left">
    <div id="limit" title="Nejvyšší povolená rychlost na chodbě">20</div>
    <div id="speedo"><b id="kmh">0</b><span>km/h</span></div>
  </div>
  <div id="drv-right">
    <button id="drv-gps" class="rbtn" aria-label="Jet podle GPS">📡</button>
    <button id="horn" class="rbtn" aria-label="Klakson">📯</button>
    <button id="report" class="rbtn big" aria-label="Nahlásit">
      <svg viewBox="0 0 24 24"><path d="M12 3l10 18H2z" fill="#fff" stroke="none"/><path d="M12 10v5M12 17.500v.01" stroke="#f76707" stroke-width="2.200"/></svg>
    </button>
  </div>
  <div id="pedals">
    <button id="brake">BRZDA</button>
    <button id="cruise">Tempomat</button>
    <button id="gas">PLYN</button>
  </div>
  <div id="drv-bottom">
    <button id="drv-exit" aria-label="Ukončit jízdu">✕</button>
    <div id="drv-eta"><b id="eta-t">–</b><span id="eta-s">–</span></div>
    <div id="drv-pts" title="Body za hlášení">⭐ <b id="pts">0</b></div>
  </div>
  <div id="rep-modal" hidden>
    <div id="rep-card">
      <h3>Co se děje na chodbě?</h3>
      <div id="rep-grid"></div>
      <button id="rep-cancel">Zrušit</button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="nav.js"></script>
<script src="app.js"></script>
<script src="driver.js"></script>
</body>
</html>
